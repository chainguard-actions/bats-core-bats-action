name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
      - name: Assert outputs
        env:
          LIB_PATH: ${{ steps.action.outputs.lib-path }}
          TMP_PATH: ${{ steps.action.outputs.tmp-path }}
        run: |
          echo "lib-path: $LIB_PATH"
          echo "tmp-path: $TMP_PATH"
          if [ "$LIB_PATH" != "/usr/lib:/usr/lib:/usr/lib:/usr/lib" ]; then
            echo "FAIL: unexpected lib-path"
            exit 1
          fi
          if [ "$TMP_PATH" != "/tmp" ]; then
            echo "FAIL: unexpected tmp-path"
            exit 1
          fi
          echo "PASS"
      - name: Assert bats and libraries installed
        run: |
          set -e
          command -v bats || { echo "FAIL: bats not on PATH"; exit 1; }
          bats --version
          for f in /usr/lib/bats-support/load.bash /usr/lib/bats-assert/load.bash \
                   /usr/lib/bats-file/load.bash /usr/lib/bats-detik/detik.bash; do
            if [ ! -f "$f" ]; then
              echo "FAIL: missing $f"
              exit 1
            fi
          done
          echo "PASS"
      - name: Run a bats test using the libraries
        env:
          BATS_LIB_PATH: ${{ steps.action.outputs.lib-path }}
        run: |
          mkdir -p /tmp/bats-smoke
          cat > /tmp/bats-smoke/smoke.bats <<'EOF'
          setup() {
            bats_load_library bats-support
            bats_load_library bats-assert
            bats_load_library bats-file
          }
          @test "assert works" {
            run echo "hello"
            assert_success
            assert_output "hello"
          }
          @test "file assert works" {
            assert_file_exists /etc/hostname
          }
          EOF
          bats /tmp/bats-smoke/smoke.bats || { echo "FAIL: bats tests failed"; exit 1; }
          echo "PASS"
