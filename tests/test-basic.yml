name: Test basic usage - install all components
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          bats-version: "1.11.0"
          support-version: "0.3.0"
          assert-version: "2.1.0"
          detik-version: "1.3.2"
          file-version: "0.4.0"

      - name: Assert bats-installed output is true
        env:
          ACTUAL: ${{ steps.action.outputs.bats-installed }}
        run: |
          echo "actual bats-installed: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected bats-installed to be 'true', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert support-installed output is true
        env:
          ACTUAL: ${{ steps.action.outputs.support-installed }}
        run: |
          echo "actual support-installed: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected support-installed to be 'true', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert assert-installed output is true
        env:
          ACTUAL: ${{ steps.action.outputs.assert-installed }}
        run: |
          echo "actual assert-installed: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected assert-installed to be 'true', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert detik-installed output is true
        env:
          ACTUAL: ${{ steps.action.outputs.detik-installed }}
        run: |
          echo "actual detik-installed: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected detik-installed to be 'true', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert file-installed output is true
        env:
          ACTUAL: ${{ steps.action.outputs.file-installed }}
        run: |
          echo "actual file-installed: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected file-installed to be 'true', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert lib-path output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.lib-path }}
        run: |
          echo "actual lib-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected lib-path to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert tmp-path output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.tmp-path }}
        run: |
          echo "actual tmp-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected tmp-path to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert bats binary is on PATH
        run: |
          echo "bats location: $(which bats || echo 'not found')"
          if ! command -v bats &>/dev/null; then
            echo "FAIL: bats binary not found on PATH"
            exit 1
          fi
          echo "bats version: $(bats --version)"
          echo "PASS"

      - name: Assert bats-support library files exist
        run: |
          if [ ! -f "/usr/lib/bats-support/load.bash" ]; then
            echo "FAIL: /usr/lib/bats-support/load.bash not found"
            exit 1
          fi
          echo "PASS: bats-support load.bash found"

      - name: Assert bats-assert library files exist
        run: |
          if [ ! -f "/usr/lib/bats-assert/load.bash" ]; then
            echo "FAIL: /usr/lib/bats-assert/load.bash not found"
            exit 1
          fi
          echo "PASS: bats-assert load.bash found"

      - name: Assert bats-file library files exist
        run: |
          if [ ! -f "/usr/lib/bats-file/load.bash" ]; then
            echo "FAIL: /usr/lib/bats-file/load.bash not found"
            exit 1
          fi
          echo "PASS: bats-file load.bash found"

      - name: Assert bats-detik library files exist
        run: |
          ls /usr/lib/bats-detik/ || true
          if [ ! -d "/usr/lib/bats-detik" ]; then
            echo "FAIL: /usr/lib/bats-detik directory not found"
            exit 1
          fi
          echo "PASS: bats-detik directory found"
