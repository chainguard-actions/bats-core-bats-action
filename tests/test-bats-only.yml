name: Test bats-only installation (no libraries)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          bats-version: "1.11.0"
          support-install: "false"
          assert-install: "false"
          detik-install: "false"
          file-install: "false"
          github-token: ${{ github.token }}

      - name: Assert bats is installed and executable
        run: |
          echo "Checking bats binary..."
          if ! command -v bats &>/dev/null; then
            echo "FAIL: bats command not found in PATH"
            exit 1
          fi
          BATS_VER=$(bats --version)
          echo "bats version: $BATS_VER"
          echo "PASS: bats is installed"

      - name: Assert bats-installed output is true
        env:
          ACTUAL: ${{ steps.action.outputs.bats-installed }}
        run: |
          echo "bats-installed: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected bats-installed=true, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert support-installed output is false
        env:
          ACTUAL: ${{ steps.action.outputs.support-installed }}
        run: |
          echo "support-installed: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected support-installed=false, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert assert-installed output is false
        env:
          ACTUAL: ${{ steps.action.outputs.assert-installed }}
        run: |
          echo "assert-installed: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected assert-installed=false, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert detik-installed output is false
        env:
          ACTUAL: ${{ steps.action.outputs.detik-installed }}
        run: |
          echo "detik-installed: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected detik-installed=false, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert file-installed output is false
        env:
          ACTUAL: ${{ steps.action.outputs.file-installed }}
        run: |
          echo "file-installed: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected file-installed=false, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert libraries are NOT installed
        run: |
          echo "Verifying libraries are not installed..."
          if [ -f "/usr/lib/bats-support/load.bash" ]; then
            echo "FAIL: bats-support should not be installed"
            exit 1
          fi
          if [ -f "/usr/lib/bats-assert/load.bash" ]; then
            echo "FAIL: bats-assert should not be installed"
            exit 1
          fi
          if [ -f "/usr/lib/bats-file/load.bash" ]; then
            echo "FAIL: bats-file should not be installed"
            exit 1
          fi
          echo "PASS: libraries are not installed as expected"

      - name: Assert tmp-path output is set
        env:
          ACTUAL: ${{ steps.action.outputs.tmp-path }}
        run: |
          echo "tmp-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: tmp-path output is empty"
            exit 1
          fi
          echo "PASS: tmp-path=$ACTUAL"
