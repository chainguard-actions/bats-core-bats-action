name: Test libs-only install - skip bats binary
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          bats-install: "false"
          support-version: "0.3.0"
          assert-version: "2.1.0"
          detik-version: "1.3.2"
          file-version: "0.4.0"

      - name: Assert bats-installed output is false
        env:
          ACTUAL: ${{ steps.action.outputs.bats-installed }}
        run: |
          echo "actual bats-installed: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected bats-installed=false, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert support-installed output is true
        env:
          ACTUAL: ${{ steps.action.outputs.support-installed }}
        run: |
          echo "actual support-installed: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected support-installed=true, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert assert-installed output is true
        env:
          ACTUAL: ${{ steps.action.outputs.assert-installed }}
        run: |
          echo "actual assert-installed: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected assert-installed=true, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert detik-installed output is true
        env:
          ACTUAL: ${{ steps.action.outputs.detik-installed }}
        run: |
          echo "actual detik-installed: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected detik-installed=true, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert file-installed output is true
        env:
          ACTUAL: ${{ steps.action.outputs.file-installed }}
        run: |
          echo "actual file-installed: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected file-installed=true, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert lib-path output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.lib-path }}
        run: |
          echo "actual lib-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected lib-path to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert bats-support library files exist at default path
        run: |
          if [ ! -f "/usr/lib/bats-support/load.bash" ]; then
            echo "FAIL: /usr/lib/bats-support/load.bash not found"
            exit 1
          fi
          echo "PASS: bats-support load.bash found"

      - name: Assert bats-assert library files exist at default path
        run: |
          if [ ! -f "/usr/lib/bats-assert/load.bash" ]; then
            echo "FAIL: /usr/lib/bats-assert/load.bash not found"
            exit 1
          fi
          echo "PASS: bats-assert load.bash found"

      - name: Assert bats-file library files exist at default path
        run: |
          if [ ! -f "/usr/lib/bats-file/load.bash" ]; then
            echo "FAIL: /usr/lib/bats-file/load.bash not found"
            exit 1
          fi
          echo "PASS: bats-file load.bash found"

      - name: Assert bats-detik library files exist at default path
        run: |
          DETIK_DIR="/usr/lib/bats-detik"
          if [ ! -d "$DETIK_DIR" ] || [ -z "$(ls -A $DETIK_DIR)" ]; then
            echo "FAIL: $DETIK_DIR is empty or missing"
            exit 1
          fi
          echo "PASS: bats-detik directory found and non-empty"
          ls -la "$DETIK_DIR"

      - name: Assert lib-path contains /usr/lib
        env:
          ACTUAL: ${{ steps.action.outputs.lib-path }}
        run: |
          echo "actual lib-path: $ACTUAL"
          if echo "$ACTUAL" | grep -q "/usr/lib"; then
            echo "PASS: lib-path contains /usr/lib"
          else
            echo "FAIL: lib-path '$ACTUAL' does not contain /usr/lib"
            exit 1
          fi
