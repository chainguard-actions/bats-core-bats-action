name: Test all installs disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          bats-install: "false"
          support-install: "false"
          assert-install: "false"
          detik-install: "false"
          file-install: "false"
      - name: Assert all installed outputs are false
        env:
          BATS: ${{ steps.action.outputs.bats-installed }}
          SUPPORT: ${{ steps.action.outputs.support-installed }}
          ASSERT: ${{ steps.action.outputs.assert-installed }}
          DETIK: ${{ steps.action.outputs.detik-installed }}
          FILE: ${{ steps.action.outputs.file-installed }}
          TMP_PATH: ${{ steps.action.outputs.tmp-path }}
        run: |
          echo "bats=$BATS support=$SUPPORT assert=$ASSERT detik=$DETIK file=$FILE tmp=$TMP_PATH"
          for v in "$BATS" "$SUPPORT" "$ASSERT" "$DETIK" "$FILE"; do
            if [ "$v" != "false" ]; then
              echo "FAIL: expected all *-installed outputs to be false"
              exit 1
            fi
          done
          if [ "$TMP_PATH" != "/tmp" ]; then
            echo "FAIL: expected tmp-path /tmp"
            exit 1
          fi
          echo "PASS"
