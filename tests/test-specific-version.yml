name: Test specific bats version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          bats-version: "1.10.0"
          support-install: "false"
          assert-install: "false"
          detik-install: "false"
          file-install: "false"
          github-token: ${{ github.token }}
      - name: Assert bats version
        run: |
          OUT="$(bats --version)"
          echo "actual: $OUT"
          if ! echo "$OUT" | grep -q "1.10.0"; then
            echo "FAIL: expected Bats 1.10.0"
            exit 1
          fi
          echo "PASS"
      - name: Assert libs not installed
        env:
          SUPPORT: ${{ steps.action.outputs.support-installed }}
          ASSERT: ${{ steps.action.outputs.assert-installed }}
          DETIK: ${{ steps.action.outputs.detik-installed }}
          FILE: ${{ steps.action.outputs.file-installed }}
        run: |
          echo "support=$SUPPORT assert=$ASSERT detik=$DETIK file=$FILE"
          for v in "$SUPPORT" "$ASSERT" "$DETIK" "$FILE"; do
            if [ "$v" != "false" ]; then
              echo "FAIL: expected all lib *-installed outputs to be false"
              exit 1
            fi
          done
          echo "PASS"
